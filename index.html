<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>ระบบฌาปนกิจสงเคราะห์ 4 ตำบล</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e5e9f0;--nav:#101827;--gold:#d7ad59;--blue:#2457a7;--green:#16845b;--red:#c33d4b;--orange:#b66b16;--shadow:0 12px 32px #17203312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#111827,#263954)}.login-card{width:min(440px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:var(--shadow)}.brand-mark{width:54px;height:54px;border-radius:16px;background:#172033;color:var(--gold);display:grid;place-items:center;font-size:25px;margin-bottom:16px}.login-card h1{font-size:23px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;font-weight:650}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7396ce;box-shadow:0 0 0 3px #2457a714}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:650}.btn.secondary{background:#edf1f7;color:#26354c}.btn.danger{background:#fff0f1;color:var(--red)}.btn.gold{background:var(--gold);color:#1c2430}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
#app{min-height:100vh}.topbar{height:64px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.topbrand{font-weight:800;letter-spacing:.2px}.topbrand span{color:var(--gold)}.userbox{display:flex;align-items:center;gap:12px;font-size:13px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:#182438;color:#dbe4f2;padding:18px 12px}.navgroup{font-size:10px;letter-spacing:1px;color:#8fa1bb;padding:14px 12px 7px}.navbtn{width:100%;text-align:left;border:0;color:#dbe4f2;background:transparent;padding:11px 12px;border-radius:9px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#293b57;color:#fff}.navbtn.active{box-shadow:inset 3px 0 var(--gold)}main{padding:24px;min-width:0;max-width:1600px;width:100%;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.pagehead h2{margin:0;font-size:23px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 3px 12px #17203308}.metric{font-size:27px;font-weight:800;margin-top:7px}.metric-label{font-size:12px;color:var(--muted)}.panel h3{margin:0 0 13px;font-size:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:300px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}th{background:#f7f8fb;color:#586477;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:30px;padding:4px 9px;font-size:11px;background:#edf1f7;color:#42516a}.tag.ok{background:#e8f7ef;color:#14774f}.tag.warn{background:#fff4e4;color:#9b5b0c}.tag.bad{background:#ffedef;color:#b72d3d}.empty{padding:28px;text-align:center;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:11px 13px;border-radius:10px;background:#fff8e9;color:#80510d;font-size:12px;margin:12px 0}.success{background:#eaf7f0;color:#146b49}.error{background:#fff0f1;color:#a82d3a}.modalback{position:fixed;inset:0;background:#0c1425a8;z-index:30;display:grid;place-items:center;padding:16px}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modalhead h3{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.formgrid .wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.statusline{font-size:12px;color:#aebbd0}.foot{font-size:11px;color:var(--muted);margin-top:18px}.mobilemenu{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}aside{display:none}aside.open{display:block;position:fixed;z-index:20;top:64px;bottom:0;width:250px;overflow:auto}.mobilemenu{display:inline-flex}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:15px}.topbar{padding:0 13px}.userbox .who{display:none}.cards{gap:9px}.card{padding:13px}.metric{font-size:22px}.pagehead h2{font-size:19px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style>
</head>
<body>
<section id="login">
 <div class="login-card">
  <div class="brand-mark">ฌ</div>
  <h1>ฌาปนกิจสงเคราะห์ 4 ตำบล</h1>
  <div class="sub">ระบบทะเบียน · การเงิน · เคลม · ฐานข้อมูลกลาง</div>
  <div class="field"><label>Supabase Project URL</label><input id="cfgUrl" type="url" placeholder="https://your-project.supabase.co"></div>
  <div class="field"><label>Supabase Publishable Key</label><input id="cfgKey" type="password" autocomplete="off" placeholder="sb_publishable_..."></div>
  <div class="field"><label>อีเมลเจ้าหน้าที่</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div>
  <div class="field"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" placeholder="รหัสผ่าน Supabase Auth"></div>
  <button class="btn gold" id="loginBtn" style="width:100%;margin-top:5px">เข้าสู่ระบบ</button>
  <div id="loginMsg" class="notice hidden"></div>
  <div class="foot">ใช้บัญชีเจ้าหน้าที่ที่ผู้ดูแลสร้างไว้ใน Supabase Auth เท่านั้น · ห้ามใส่ Service Role Key ในเว็บไซต์</div>
 </div>
</section>
<div id="app" class="hidden">
 <header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="btn secondary small mobilemenu" id="menuBtn">☰</button><div class="topbrand">ฌาปนกิจ <span>4 ตำบล</span></div></div>
  <div class="userbox"><span class="statusline" id="syncStatus">กำลังเชื่อมต่อ…</span><span class="who" id="who"></span><button class="btn secondary small" id="logoutBtn">ออกจากระบบ</button></div>
 </header>
 <div class="layout">
  <aside id="sidebar">
   <div class="navgroup">ภาพรวม</div>
   <button class="navbtn active" data-page="dashboard">▦ ภาพรวมระบบ</button>
   <div class="navgroup">งานทะเบียน</div>
   <button class="navbtn" data-page="members">♙ ทะเบียนสมาชิก</button>
   <button class="navbtn" data-page="applications">▤ ใบสมัคร</button>
   <button class="navbtn" data-page="claims">♡ เคลมเงินสงเคราะห์</button>
   <div class="navgroup">การเงิน</div>
   <button class="navbtn" data-page="payments">฿ รับชำระเงิน</button>
   <button class="navbtn" data-page="funds">▣ กองทุนและอัตรา</button>
   <button class="navbtn" data-page="reports">▥ รายงาน</button>
   <div class="navgroup">ระบบ</div>
   <button class="navbtn" data-page="audit">◷ ประวัติการทำรายการ</button>
   <button class="navbtn" data-page="settings">⚙ ตั้งค่าและสำรองข้อมูล</button>
  </aside>
  <main id="main"></main>
 </div>
</div>
<div id="modalRoot"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const CONFIG_KEY = 'chapanakit_new_config_v1';
const CACHE_PREFIX = 'chapanakit_new_cache_v1_';
const TABLE = 'kv';
const KEYS = ['members','apps','pays','exps','claims','funds','levies','counters','settings','audit','notes'];
const ROLE_NAMES = {admin:'ผู้ดูแลระบบ',treasurer:'เหรัญญิก',registrar:'เจ้าหน้าที่ทะเบียน',auditor:'ผู้ตรวจสอบ',collector:'เจ้าหน้าที่รับเงิน'};
const READ = {
 admin:KEYS,
 treasurer:['members','apps','pays','exps','claims','funds','levies','counters','settings','audit','notes'],
 registrar:['members','apps','claims','funds','counters','settings','audit','notes'],
 auditor:['members','apps','pays','exps','claims','funds','levies','counters','settings','audit','notes'],
 collector:['members','pays','funds','counters','settings']
};
const WRITE = {
 admin:KEYS,
 treasurer:['pays','exps','levies','counters','audit','notes'],
 registrar:['members','apps','claims','counters','audit','notes'],
 auditor:[],
 collector:['pays','counters','audit']
};
const fresh = () => ({
 members:[],apps:[],pays:[],exps:[],claims:[],funds:[
  {id:crypto.randomUUID(),name:'กองทุนหลัก 90,000 บาท',monthly:0,active:true}
 ],levies:[],counters:{member:0,app:0,payment:0,claim:0},
 settings:{organization:'กลุ่มฌาปนกิจสงเคราะห์ 4 ตำบล',benefit:90000,areas:['ตำบลที่ 1','ตำบลที่ 2','ตำบลที่ 3','ตำบลที่ 4']},
 audit:[],notes:[]
});
let sb=null, session=null, role='', db=fresh(), revisions={}, dirty=new Set(), currentPage='dashboard', busy=false, lastSync=null;
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const dateTH = v => {if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('th-TH',{dateStyle:'medium'});};
const nowISO = () => new Date().toISOString();
const canRead = k => (READ[role]||[]).includes(k);
const canWrite = k => (WRITE[role]||[]).includes(k);
const cacheKey = () => CACHE_PREFIX+(session?.user?.id||'anonymous');
function setSync(s){$('syncStatus').textContent=s;}
function message(el,text,kind='notice'){el.className=kind;el.textContent=text;el.classList.remove('hidden');}
function hideMessage(el){el.classList.add('hidden');}
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({db,revisions,dirty:[...dirty],savedAt:nowISO()}));}catch(e){console.warn('cache unavailable',e);}}
function loadCache(){try{const x=JSON.parse(localStorage.getItem(cacheKey())||'null');if(x?.db){db={...fresh(),...x.db};revisions=x.revisions||{};dirty=new Set(x.dirty||[]);}}catch(e){console.warn(e);}}
function audit(action,detail){if(!canWrite('audit'))return;db.audit.unshift({id:crypto.randomUUID(),at:nowISO(),actor:session?.user?.email||'',role,action,detail:String(detail||'')});db.audit=db.audit.slice(0,1500);dirty.add('audit');}
function mark(key){if(!canWrite(key)){alert('บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูลส่วนนี้');return false;}dirty.add(key);saveCache();return true;}
function nextNo(kind,prefix){db.counters[kind]=(Number(db.counters[kind])||0)+1;dirty.add('counters');return prefix+String(db.counters[kind]).padStart(6,'0');}
function modal(title,body){$('modalRoot').innerHTML=`<div class="modalback" id="backdrop"><section class="modal"><div class="modalhead"><h3>${title}</h3><button class="btn secondary small" id="closeModal">ปิด</button></div>${body}</section></div>`;$('closeModal').onclick=closeModal;$('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal();});}
function closeModal(){$('modalRoot').innerHTML='';}
function nav(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));$('sidebar').classList.remove('open');render();}
function setPage(p){currentPage=p;nav();}
function shell(title,desc,actions=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="muted" style="font-size:12px;margin-top:3px">${desc||''}</div></div><div>${actions}</div></div>`;}
function table(headers,rows){if(!rows.length)return '<div class="empty">ยังไม่มีข้อมูล</div>';return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
function metric(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="metric-label">${sub}</div></div>`;}
function renderDashboard(){
 const m=db.members||[],a=db.apps||[],p=db.pays||[],c=db.claims||[];
 const pending=a.filter(x=>x.status==='รอตรวจสอบ').length;
 const paid=p.reduce((n,x)=>n+Number(x.amount||0),0);
 return shell('ภาพรวมระบบ','สรุปข้อมูลจากฐานข้อมูลกลาง')+
 `<div class="cards">${metric('สมาชิกทั้งหมด',money(m.length),'ราย')}${metric('ใบสมัครรอตรวจ',money(pending),'รายการ')}${metric('เคลมทั้งหมด',money(c.length),'รายการ')}${metric('ยอดรับชำระสะสม',money(paid),'บาท')}</div>
 <div class="grid2"><section class="panel"><h3>รายการล่าสุด</h3>${table(['วันที่','ประเภท','รายละเอียด','ผู้ทำรายการ'],(db.audit||[]).slice(0,8).map(x=>`<tr><td>${dateTH(x.at)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td><td>${esc(x.actor)}</td></tr>`))}</section><section class="panel"><h3>สถานะการเชื่อมต่อ</h3><p><span class="tag ok">Supabase Auth: เข้าสู่ระบบแล้ว</span></p><p class="muted" style="font-size:13px">บทบาท: ${esc(ROLE_NAMES[role]||role)}</p><p class="muted" style="font-size:13px">ซิงค์ล่าสุด: ${lastSync?dateTH(lastSync):'ยังไม่ซิงค์'}</p><button class="btn" id="syncNow">ซิงค์ข้อมูลตอนนี้</button><div class="notice">ข้อมูลที่ผู้ใช้แต่ละบทบาทอ่านหรือแก้ไขได้ ถูกควบคุมซ้ำอีกชั้นด้วย Row Level Security ใน Supabase</div></section></div>`;
}
function renderMembers(){
 const q=($('search')?.value||'').toLowerCase();
 const rows=(db.members||[]).filter(x=>[x.memberNo,x.name,x.nationalId,x.phone,x.area].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.memberNo)}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.area)}</td><td>${esc(x.status||'ปกติ')}</td><td><button class="btn secondary small" data-edit-member="${esc(x.id)}">แก้ไข</button></td></tr>`);
 const act=canWrite('members')?'<button class="btn" id="addMember">+ เพิ่มสมาชิก</button>':'';
 return shell('ทะเบียนสมาชิก','ค้นหาและจัดการข้อมูลสมาชิก',act)+`<section class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหาชื่อ เลขสมาชิก เบอร์โทร หรือตำบล"></div>${table(['เลขสมาชิก','ชื่อ-สกุล','โทรศัพท์','ตำบล','สถานะ','จัดการ'],rows)}</section>`;
}
function memberForm(item={}){
 if(!canWrite('members'))return;
 const isEdit=!!item.id;
 modal(isEdit?'แก้ไขข้อมูลสมาชิก':'เพิ่มสมาชิก',`<form id="memberForm"><div class="formgrid">
 <div class="field"><label>เลขสมาชิก</label><input name="memberNo" value="${esc(item.memberNo||'')}" placeholder="เว้นว่างเพื่อสร้างอัตโนมัติ"></div>
 <div class="field"><label>ชื่อ-นามสกุล *</label><input name="name" required value="${esc(item.name||'')}"></div>
 <div class="field"><label>เลขบัตรประชาชน</label><input name="nationalId" inputmode="numeric" maxlength="13" value="${esc(item.nationalId||'')}"></div>
 <div class="field"><label>เบอร์โทรศัพท์</label><input name="phone" value="${esc(item.phone||'')}"></div>
 <div class="field"><label>ตำบล</label><input name="area" value="${esc(item.area||'')}"></div>
 <div class="field"><label>วันเกิด</label><input name="dob" type="date" value="${esc(item.dob||'')}"></div>
 <div class="field"><label>วันที่สมัคร</label><input name="joinedAt" type="date" value="${esc(item.joinedAt||new Date().toISOString().slice(0,10))}"></div>
 <div class="field"><label>สถานะ</label><select name="status"><option ${item.status==='ปกติ'?'selected':''}>ปกติ</option><option ${item.status==='พักสิทธิ์'?'selected':''}>พักสิทธิ์</option><option ${item.status==='เสียชีวิต'?'selected':''}>เสียชีวิต</option></select></div>
 <div class="field wide"><label>หมายเหตุ</label><textarea name="note" rows="2">${esc(item.note||'')}</textarea></div></div>
 <div class="actions"><button type="button" class="btn secondary" id="cancelForm">ยกเลิก</button><button class="btn">บันทึกข้อมูล</button></div></form>`);
 $('cancelForm').onclick=closeModal;
 $('memberForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());if(!v.name.trim())return;
 if(!v.memberNo)v.memberNo=nextNo('member','MB');
 const row={...item,...v,id:item.id||crypto.randomUUID(),createdAt:item.createdAt||nowISO(),updatedAt:nowISO()};
 const idx=db.members.findIndex(x=>x.id===row.id);if(idx>=0)db.members[idx]=row;else db.members.unshift(row);
 mark('members');audit(isEdit?'member.update':'member.create',row.memberNo+' '+row.name);saveCache();closeModal();render();syncDirty();
 };
}
function renderApplications(){
 const rows=(db.apps||[]).map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.name)}</td><td>${esc(x.area)}</td><td>${dateTH(x.createdAt)}</td><td><span class="tag ${x.status==='อนุมัติ'?'ok':x.status==='ปฏิเสธ'?'bad':'warn'}">${esc(x.status)}</span></td><td>${canWrite('apps')?`<button class="btn secondary small" data-app="${esc(x.id)}">พิจารณา</button>`:''}</td></tr>`);
 const act=canWrite('apps')?'<button class="btn" id="addApp">+ รับใบสมัคร</button>':'';
 return shell('ใบสมัครสมาชิก','บันทึกใบสมัครและติดตามผลพิจารณา',act)+`<section class="panel">${table(['เลขใบสมัคร','ชื่อผู้สมัคร','ตำบล','วันที่ยื่น','สถานะ','จัดการ'],rows)}</section>`;
}
function appForm(item={}){
 if(!canWrite('apps'))return;
 modal(item.id?'พิจารณาใบสมัคร':'รับใบสมัคร',`<form id="appForm"><div class="formgrid">
 <div class="field"><label>ชื่อ-นามสกุล *</label><input name="name" required value="${esc(item.name||'')}"></div>
 <div class="field"><label>เลขบัตรประชาชน</label><input name="nationalId" maxlength="13" value="${esc(item.nationalId||'')}"></div>
 <div class="field"><label>เบอร์โทร</label><input name="phone" value="${esc(item.phone||'')}"></div>
 <div class="field"><label>ตำบล</label><input name="area" value="${esc(item.area||'')}"></div>
 <div class="field"><label>สถานะ</label><select name="status"><option>รอตรวจสอบ</option><option>อนุมัติ</option><option>ส่งกลับแก้ไข</option><option>ปฏิเสธ</option></select></div>
 <div class="field"><label>หมายเหตุการพิจารณา</label><input name="note" value="${esc(item.note||'')}"></div></div><div class="actions"><button type="button" class="btn secondary" id="cancelForm">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
 $('appForm').elements.status.value=item.status||'รอตรวจสอบ';$('cancelForm').onclick=closeModal;
 $('appForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const row={...item,...v,id:item.id||crypto.randomUUID(),no:item.no||nextNo('app','AP'),createdAt:item.createdAt||nowISO(),updatedAt:nowISO()};const i=db.apps.findIndex(x=>x.id===row.id);if(i>=0)db.apps[i]=row;else db.apps.unshift(row);mark('apps');audit('application.save',row.no+' '+row.status);saveCache();closeModal();render();syncDirty();};
}
function renderPayments(){
 const rows=(db.pays||[]).map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.memberName)}</td><td>${esc(x.kind)}</td><td>${money(x.amount)}</td><td>${dateTH(x.date)}</td><td>${esc(x.method)}</td></tr>`);
 const act=canWrite('pays')?'<button class="btn" id="addPay">+ บันทึกรับเงิน</button>':'';
 const total=db.pays.reduce((n,x)=>n+Number(x.amount||0),0);
 return shell('รับชำระเงิน','บันทึกรายรับและตรวจสอบรายการ',act)+`<div class="cards">${metric('จำนวนรายการ',money(db.pays.length),'รายการ')}${metric('ยอดรวม',money(total),'บาท')}${metric('สมาชิกในทะเบียน',money(db.members.length),'ราย')}${metric('กองทุนที่เปิดใช้',money(db.funds.filter(x=>x.active).length),'กองทุน')}</div><section class="panel">${table(['เลขที่','สมาชิก','ประเภทรายการ','จำนวนเงิน','วันที่','วิธีชำระ'],rows)}</section>`;
}
function paymentForm(){
 if(!canWrite('pays'))return;
 modal('บันทึกรับชำระเงิน',`<form id="payForm"><div class="formgrid">
 <div class="field wide"><label>สมาชิก *</label><select name="memberId" required><option value="">เลือกสมาชิก</option>${db.members.map(m=>`<option value="${esc(m.id)}">${esc(m.memberNo)} · ${esc(m.name)}</option>`).join('')}</select></div>
 <div class="field"><label>ประเภทรายการ</label><select name="kind"><option>เงินบำรุง</option><option>ค่าสมัคร</option><option>เงินสมทบ</option><option>อื่น ๆ</option></select></div>
 <div class="field"><label>จำนวนเงิน *</label><input name="amount" type="number" min="0.01" step="0.01" required></div>
 <div class="field"><label>วันที่รับเงิน</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>วิธีชำระ</label><select name="method"><option>เงินสด</option><option>โอนเงิน</option><option>อื่น ๆ</option></select></div>
 <div class="field wide"><label>หมายเหตุ</label><input name="note"></div></div><div class="actions"><button type="button" class="btn secondary" id="cancelForm">ยกเลิก</button><button class="btn">บันทึกรับเงิน</button></div></form>`);
 $('cancelForm').onclick=closeModal;$('payForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());const m=db.members.find(x=>x.id===v.memberId);if(!m)return;const row={...v,id:crypto.randomUUID(),no:nextNo('payment','RC'),memberName:m.name,amount:Number(v.amount),createdAt:nowISO(),createdBy:session.user.id};db.pays.unshift(row);mark('pays');audit('payment.create',row.no+' '+m.name+' '+row.amount);saveCache();closeModal();render();syncDirty();};
}
function renderClaims(){
 const rows=db.claims.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.memberName)}</td><td>${money(x.amount)}</td><td>${dateTH(x.date)}</td><td><span class="tag ${x.status==='อนุมัติ'?'ok':x.status==='ปฏิเสธ'?'bad':'warn'}">${esc(x.status)}</span></td><td>${canWrite('claims')?`<button class="btn secondary small" data-claim="${esc(x.id)}">แก้ไข</button>`:''}</td></tr>`);
 const act=canWrite('claims')?'<button class="btn" id="addClaim">+ บันทึกเคลม</button>':'';
 return shell('เคลมเงินสงเคราะห์','ทะเบียนคำขอและผลการพิจารณา',act)+`<section class="panel">${table(['เลขเคลม','สมาชิก','จำนวนเงิน','วันที่แจ้ง','สถานะ','จัดการ'],rows)}</section>`;
}
function claimForm(item={}){
 if(!canWrite('claims'))return;
 modal(item.id?'แก้ไขเคลม':'บันทึกคำขอเคลม',`<form id="claimForm"><div class="formgrid">
 <div class="field wide"><label>สมาชิก *</label><select name="memberId" required><option value="">เลือกสมาชิก</option>${db.members.map(m=>`<option value="${esc(m.id)}" ${m.id===item.memberId?'selected':''}>${esc(m.memberNo)} · ${esc(m.name)}</option>`).join('')}</select></div>
 <div class="field"><label>จำนวนเงิน</label><input name="amount" type="number" min="0" value="${esc(item.amount??db.settings.benefit)}"></div>
 <div class="field"><label>วันที่แจ้ง</label><input name="date" type="date" value="${esc(item.date||new Date().toISOString().slice(0,10))}"></div>
 <div class="field"><label>สถานะ</label><select name="status"><option>รอตรวจสอบ</option><option>อนุมัติ</option><option>ปฏิเสธ</option><option>จ่ายแล้ว</option></select></div>
 <div class="field"><label>หมายเหตุ</label><input name="note" value="${esc(item.note||'')}"></div></div><div class="actions"><button type="button" class="btn secondary" id="cancelForm">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
 $('claimForm').elements.status.value=item.status||'รอตรวจสอบ';$('cancelForm').onclick=closeModal;
 $('claimForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries()),m=db.members.find(x=>x.id===v.memberId);if(!m)return;const row={...item,...v,id:item.id||crypto.randomUUID(),no:item.no||nextNo('claim','CL'),memberName:m.name,amount:Number(v.amount),createdAt:item.createdAt||nowISO()};const i=db.claims.findIndex(x=>x.id===row.id);if(i>=0)db.claims[i]=row;else db.claims.unshift(row);mark('claims');audit('claim.save',row.no+' '+row.status);saveCache();closeModal();render();syncDirty();};
}
function renderFunds(){
 const rows=db.funds.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.monthly)}</td><td>${x.active?'<span class="tag ok">เปิดใช้งาน</span>':'<span class="tag">ปิดใช้งาน</span>'}</td><td>${canWrite('funds')?`<button class="btn secondary small" data-fund="${esc(x.id)}">แก้ไข</button>`:''}</td></tr>`);
 const act=canWrite('funds')?'<button class="btn" id="addFund">+ เพิ่มกองทุน</button>':'';
 return shell('กองทุนและอัตรา','จัดการชื่อกองทุนและยอดเงินสมทบ',act)+`<section class="panel">${table(['ชื่อกองทุน','ยอดรายเดือน/คน','สถานะ','จัดการ'],rows)}</section>`;
}
function fundForm(item={}){
 if(!canWrite('funds'))return;
 modal(item.id?'แก้ไขกองทุน':'เพิ่มกองทุน',`<form id="fundForm"><div class="field"><label>ชื่อกองทุน *</label><input name="name" required value="${esc(item.name||'')}"></div><div class="field"><label>ยอดรายเดือนต่อคน (บาท)</label><input name="monthly" type="number" min="0" value="${esc(item.monthly||0)}"></div><div class="field"><label>สถานะ</label><select name="active"><option value="true">เปิดใช้งาน</option><option value="false">ปิดใช้งาน</option></select></div><div class="actions"><button type="button" class="btn secondary" id="cancelForm">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
 $('fundForm').elements.active.value=String(item.active!==false);$('cancelForm').onclick=closeModal;$('fundForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries()),row={...item,...v,id:item.id||crypto.randomUUID(),monthly:Number(v.monthly),active:v.active==='true'};const i=db.funds.findIndex(x=>x.id===row.id);if(i>=0)db.funds[i]=row;else db.funds.push(row);mark('funds');audit('fund.save',row.name);saveCache();closeModal();render();syncDirty();};
}
function renderReports(){
 const sum=db.pays.reduce((n,x)=>n+Number(x.amount||0),0),byKind={};db.pays.forEach(x=>byKind[x.kind]=(byKind[x.kind]||0)+Number(x.amount||0));
 return shell('รายงาน','สรุปทะเบียนและการเงิน')+`<div class="cards">${metric('สมาชิก',money(db.members.length),'ราย')}${metric('ใบสมัคร',money(db.apps.length),'รายการ')}${metric('เคลม',money(db.claims.length),'รายการ')}${metric('รับชำระรวม',money(sum),'บาท')}</div><section class="panel"><h3>รายรับแยกตามประเภท</h3>${table(['ประเภท','ยอดรวม (บาท)'],Object.entries(byKind).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`))}<div class="actions"><button class="btn" id="exportCsv">ส่งออกรายรับ CSV</button><button class="btn secondary" id="exportMembersCsv">ส่งออกทะเบียน CSV</button></div></section>`;
}
function renderAudit(){return shell('ประวัติการทำรายการ','ตรวจสอบการเปลี่ยนแปลงในระบบ')+`<section class="panel">${table(['เวลา','ผู้ใช้','บทบาท','การกระทำ','รายละเอียด'],db.audit.map(x=>`<tr><td>${new Date(x.at).toLocaleString('th-TH')}</td><td>${esc(x.actor)}</td><td>${esc(ROLE_NAMES[x.role]||x.role)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`))}</section>`;}
function renderSettings(){
 return shell('ตั้งค่าและสำรองข้อมูล','การตั้งค่าการเชื่อมต่อและการจัดเก็บข้อมูล')+
 `<div class="grid2"><section class="panel"><h3>ข้อมูลกลุ่ม</h3><form id="settingsForm"><div class="field"><label>ชื่อหน่วยงาน</label><input name="organization" value="${esc(db.settings.organization)}"></div><div class="field"><label>เงินสงเคราะห์ (บาท)</label><input name="benefit" type="number" value="${esc(db.settings.benefit)}"></div><div class="field"><label>รายชื่อตำบล (คั่นด้วยเครื่องหมายจุลภาค)</label><input name="areas" value="${esc((db.settings.areas||[]).join(', '))}"></div><button class="btn">บันทึกตั้งค่า</button></form></section>
 <section class="panel"><h3>สำรองและนำเข้าข้อมูล</h3><p class="muted" style="font-size:13px">ไฟล์สำรองมีข้อมูลสมาชิกและข้อมูลการเงิน ควรเก็บในที่ปลอดภัยและจำกัดผู้เข้าถึง</p><div class="toolbar"><button class="btn" id="backupBtn">ดาวน์โหลดไฟล์สำรอง JSON</button><label class="btn secondary" for="restoreFile">นำเข้าไฟล์ JSON</label><input id="restoreFile" type="file" accept="application/json,.json" class="hidden"></div><div class="notice">ก่อนเปลี่ยนจากระบบเดิม v63 ให้เปิดระบบเดิมและส่งออกไฟล์สำรองก่อน แล้วจึงนำเข้าในระบบใหม่นี้</div></section></div>
 <section class="panel" style="margin-top:14px"><h3>บัญชีเจ้าหน้าที่</h3><p class="muted" style="font-size:13px">สร้างหรือเปลี่ยนบทบาทบัญชีผ่าน Supabase Dashboard → Authentication → Users และกำหนด app_metadata.app_role เป็น admin, treasurer, registrar, auditor หรือ collector พร้อม app_active=true การกำหนดบทบาทต้องทำโดยผู้ดูแลที่ได้รับอนุญาตเท่านั้น</p><p><a href="https://supabase.com/dashboard/project/yskgbuytmmwhpdgdvgzz/auth/users" target="_blank" rel="noopener">เปิด Supabase Auth Users</a></p></section>`;
}
function render(){
 const pages={dashboard:renderDashboard,members:renderMembers,applications:renderApplications,payments:renderPayments,claims:renderClaims,funds:renderFunds,reports:renderReports,audit:renderAudit,settings:renderSettings};
 $('main').innerHTML=(pages[currentPage]||renderDashboard)();
 bindPage();
}
function bindPage(){
 const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};
 on('syncNow',()=>syncAll(true));
 on('addMember',()=>memberForm());
 on('addApp',()=>appForm());
 on('addPay',paymentForm);
 on('addClaim',()=>claimForm());
 on('addFund',()=>fundForm());
 on('search',e=>{e.target.addEventListener('input',()=>{const p=e.target.selectionStart;render();const s=$('search');s.focus();s.setSelectionRange(p,p);});});
 document.querySelectorAll('[data-edit-member]').forEach(b=>b.onclick=()=>memberForm(db.members.find(x=>x.id===b.dataset.editMember)||{}));
 document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>appForm(db.apps.find(x=>x.id===b.dataset.app)||{}));
 document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claimForm(db.claims.find(x=>x.id===b.dataset.claim)||{}));
 document.querySelectorAll('[data-fund]').forEach(b=>b.onclick=()=>fundForm(db.funds.find(x=>x.id===b.dataset.fund)||{}));
 on('settingsForm',null);
 const sf=$('settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();if(!mark('settings'))return;const v=Object.fromEntries(new FormData(sf).entries());db.settings.organization=v.organization;db.settings.benefit=Number(v.benefit);db.settings.areas=v.areas.split(',').map(x=>x.trim()).filter(Boolean);audit('settings.update','ปรับการตั้งค่าหน่วยงาน');saveCache();render();syncDirty();};
 on('backupBtn',backupJSON);
 on('restoreFile',e=>{e.target.onchange=restoreJSON;});
 on('exportCsv',()=>downloadCSV('payments.csv',['เลขที่','สมาชิก','ประเภท','จำนวนเงิน','วันที่','วิธีชำระ'],db.pays.map(x=>[x.no,x.memberName,x.kind,x.amount,x.date,x.method])));
 on('exportMembersCsv',()=>downloadCSV('members.csv',['เลขสมาชิก','ชื่อ','เลขบัตร','โทรศัพท์','ตำบล','สถานะ'],db.members.map(x=>[x.memberNo,x.name,x.nationalId,x.phone,x.area,x.status])));
}
function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function backupJSON(){const payload={format:'chapanakit-backup-v1',createdAt:nowISO(),data:db};download('chapanakit-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(payload,null,2),'application/json');}
function downloadCSV(name,headers,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download(name,'\ufeff'+[headers,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
async function restoreJSON(e){
 const file=e.target.files?.[0];if(!file)return;
 try{const obj=JSON.parse(await file.text()),incoming=obj.data||obj;if(!confirm('นำเข้าข้อมูลจะเขียนทับข้อมูลในหน้าจอนี้ ต้องการดำเนินการต่อหรือไม่?'))return;
 for(const k of KEYS){if(incoming[k]!==undefined&&canWrite(k)){db[k]=incoming[k];dirty.add(k);}}
 saveCache();audit('backup.restore',file.name);render();await syncDirty();alert('นำเข้าข้อมูลในเครื่องแล้ว');}
 catch(err){alert('อ่านไฟล์ไม่สำเร็จ: '+err.message);}
 e.target.value='';
}
async function syncKey(key){
 if(!canWrite(key))return;
 const value=db[key]??(Array.isArray(fresh()[key])?[]:{});
 const rev=revisions[key]||0;
 if(rev===0){
  const {data:existing,error:readErr}=await sb.from(TABLE).select('key,rev').eq('key',key).maybeSingle();
  if(readErr)throw readErr;
  if(existing){revisions[key]=existing.rev;return syncKey(key);}
  const {data,error}=await sb.from(TABLE).insert({key,data:value,rev:1,updated_by:session.user.id}).select('rev').single();
  if(error){if(error.code==='23505'){const again=await sb.from(TABLE).select('rev').eq('key',key).single();if(again.error)throw again.error;revisions[key]=again.data.rev;return syncKey(key);}throw error;}
  revisions[key]=data.rev;dirty.delete(key);return;
 }
 const {data,error}=await sb.from(TABLE).update({data:value,rev:rev+1,updated_by:session.user.id,updated_at:nowISO()}).eq('key',key).eq('rev',rev).select('rev').maybeSingle();
 if(error)throw error;
 if(!data)throw new Error('ข้อมูล '+key+' ถูกแก้ไขจากเครื่องอื่น กรุณาซิงค์ใหม่ก่อนบันทึก');
 revisions[key]=data.rev;dirty.delete(key);
}
async function syncDirty(){
 if(!sb||!session)return;
 const list=[...dirty].filter(k=>canWrite(k));
 if(!list.length)return;
 setSync('กำลังบันทึก…');
 for(const k of list)await syncKey(k);
 saveCache();lastSync=nowISO();setSync('ซิงค์แล้ว '+new Date(lastSync).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));
}
async function syncAll(showToast=false){
 if(busy||!sb||!session)return;
 busy=true;setSync('กำลังซิงค์…');
 try{
  const {data,error}=await sb.from(TABLE).select('key,data,rev,updated_at');
  if(error)throw error;
  const remote={};(data||[]).forEach(r=>remote[r.key]=r);
  for(const k of KEYS){
   if(!canRead(k))continue;
   const row=remote[k];
   if(row){db[k]=row.data??(Array.isArray(fresh()[k])?[]:{});revisions[k]=row.rev;}
   else if(role==='admin'&&!dirty.has(k)){db[k]=fresh()[k];revisions[k]=0;dirty.add(k);}
  }
  saveCache();
  if(role==='admin'){
   for(const k of [...dirty])if(canWrite(k))await syncKey(k);
  }
  lastSync=nowISO();setSync('เชื่อมต่อแล้ว · '+new Date(lastSync).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}));
  if(showToast)alert('ซิงค์ข้อมูลเรียบร้อย');
 }catch(e){console.error(e);setSync('ซิงค์ไม่สำเร็จ');if(showToast)alert('ซิงค์ไม่สำเร็จ: '+e.message);}
 finally{busy=false;render();}
}
async function login(){
 const url=$('cfgUrl').value.trim().replace(/\/+$/,''),key=$('cfgKey').value.trim(),email=$('email').value.trim(),password=$('password').value;
 hideMessage($('loginMsg'));
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key||!email||!password){message($('loginMsg'),'กรุณากรอก Project URL, Publishable Key, อีเมล และรหัสผ่านให้ครบ','error');return;}
 $('loginBtn').disabled=true;$('loginBtn').textContent='กำลังเข้าสู่ระบบ…';
 try{
  sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
  session=data.session;if(!session)throw new Error('ไม่พบ session หลังเข้าสู่ระบบ');
  const {data:userData,error:userErr}=await sb.auth.getUser();if(userErr)throw userErr;
  session.user=userData.user;const meta=session.user.app_metadata||{};
  role=meta.app_role||'';
  if(meta.app_active===false)throw new Error('บัญชีนี้ถูกระงับ กรุณาติดต่อผู้ดูแลระบบ');
  if(!ROLE_NAMES[role])throw new Error('บัญชียังไม่ได้กำหนด app_role ที่ถูกต้องใน Supabase Auth');
  localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));
  loadCache();
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('who').textContent=(session.user.email||'')+' · '+ROLE_NAMES[role];
  currentPage='dashboard';nav();
  await syncAll(false);
  sb.auth.onAuthStateChange(async(event,newSession)=>{if(event==='SIGNED_OUT'){location.reload();return;}if(newSession){session=newSession;session.user=newSession.user||session.user;}});
  setInterval(()=>{if(document.visibilityState==='visible'&&!busy)syncAll(false);},30000);
 }catch(e){console.error(e);message($('loginMsg'),e.message||'เข้าสู่ระบบไม่สำเร็จ','error');if(sb){try{await sb.auth.signOut();}catch(_){}}sb=null;}
 finally{$('loginBtn').disabled=false;$('loginBtn').textContent='เข้าสู่ระบบ';}
}
async function logout(){if(sb)await sb.auth.signOut();session=null;location.reload();}
function init(){
 try{const c=JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}');$('cfgUrl').value=c.url||'https://yskgbuytmmwhpdgdvgzz.supabase.co';$('cfgKey').value=c.key||'';}catch(_){}
 $('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});$('logoutBtn').onclick=logout;
 $('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
 document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
}
init();
})();
</script>
